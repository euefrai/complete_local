<section id="tab-content-history" class="tab-panel">
  <div class="panel-header">
    <div>
      <h1>Histórico de Arquivos e Imagens</h1>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Todos os arquivos de código e imagens gerados durante a sessão atual para download rápido.</p>
    </div>
  </div>

  <!-- Artifact list (Tables and metrics) -->
  <div class="card history-container">
    <div class="history-tabs">
      <button class="history-tab-btn active" id="history-tab-files" onclick="switchHistoryTab('files')">Arquivos de Código</button>
      <button class="history-tab-btn" id="history-tab-images" onclick="switchHistoryTab('images')">Imagens Geradas</button>
    </div>

    <!-- Section: Files Table -->
    <div class="history-section active" id="history-section-files">
      <table class="artifacts-table" id="files-table">
        <thead>
          <tr>
            <th style="width: 40%">Nome do Arquivo</th>
            <th style="width: 20%">Extensão</th>
            <th style="width: 25%">Gerado Por</th>
            <th style="width: 15%; text-align: right;">Ação</th>
          </tr>
        </thead>
        <tbody id="files-table-body">
          <tr>
            <td colspan="4" class="empty-table-row">Nenhum arquivo gerado nesta sessão ainda.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Section: Images Gallery -->
    <div class="history-section" id="history-section-images">
      <div class="gallery-grid" id="images-gallery">
        <div class="empty-gallery">Nenhuma imagem gerada nesta sessão ainda.</div>
      </div>
    </div>
  </div>
</section>
