<section id="tab-content-skills" class="tab-panel">
  <div class="panel-header">
    <div>
      <h1>Habilidades & Scripts de Automação</h1>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">Visualize os scripts de automação criados por você ou gerados autonomamente pelas IAs na pasta skills/.</p>
    </div>
    <div class="header-actions">
      <button class="action-btn" onclick="loadSkillsList()" title="Recarregar habilidades">
        <i class="ti ti-refresh"></i>
        <span>Atualizar</span>
      </button>
    </div>
  </div>

  <div class="skills-workspace-layout" style="padding: 1.25rem; flex-grow: 1; overflow: hidden; height: calc(100% - 60px); display: flex; flex-direction: column; gap: 1rem;">
    <!-- Top summary cards -->
    <div class="skills-meta-bar" style="display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <button class="action-btn" onclick="showNewSkillModal()" style="height: 32px; background: var(--accent); color: white; border-color: var(--accent);">
        <i class="ti ti-file-plus"></i> Nova Habilidade
      </button>
      <span style="font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono);">skills/ (projeto)</span>
    </div>

    <!-- Skills Table Card -->
    <div class="card" style="flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; display: flex; flex-direction: column;">
      <table class="artifacts-table" id="skills-table">
        <thead>
          <tr>
            <th style="width: 35%">Nome da Habilidade</th>
            <th style="width: 20%">Tipo/Linguagem</th>
            <th style="width: 25%">Última Modificação</th>
            <th style="width: 20%; text-align: right;">Ações</th>
          </tr>
        </thead>
        <tbody id="skills-table-body">
          <tr>
            <td colspan="4" class="empty-table-row" style="text-align: center; padding: 24px; color: var(--text-tertiary);">Carregando habilidades do servidor...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Skills Editor Viewport (displays content when editing/viewing a skill) -->
    <div id="skill-editor-viewport" class="note-editor-viewport" style="display: none; height: 320px; flex-shrink: 0; margin-top: 10px;"></div>
  </div>
</section>
